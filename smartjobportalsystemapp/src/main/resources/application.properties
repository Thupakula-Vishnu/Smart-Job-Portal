# ==========================================
# Application
# ==========================================

spring.application.name=smartjobportalsystemapp
server.port=9988


# ==========================================
# MySQL Database
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/smartjobportalmanagement
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# Actuator
# ==========================================

# Expose required actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings,env

# Actuator base URL
management.endpoints.web.base-path=/actuator

# Show health details
management.endpoint.health.show-details=always

# Enable endpoints
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.beans.enabled=true
management.endpoint.mappings.enabled=true
management.endpoint.env.enabled=true


# ==========================================
# Actuator Info
# ==========================================

info.app.name=Smart Job Portal System
info.app.version=1.0.0
info.app.description=REST API using Spring Boot
info.app.developer=Vishnu


# ==========================================
# JWT Configuration
# ==========================================

jwt.secret=SmartJobPortalSystemSecretKeyForJwtAuthentication2026SecureKey
jwt.expiration=86400000